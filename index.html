<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Notas PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <header>
        <h1>📝 Mis Notas Offline</h1>
        <button id="btnInstalar" style="display: none;">Instalar App ⬇️</button>
    </header>

    <main>
        <form id="formNota">
            <input type="text" id="inputNota" placeholder="Escribe una nota rápida..." required>
            <button type="submit">Guardar</button>
        </form>

        <div id="listaNotas"></div>
        
        <button id="btnUbicacion">📍 Obtener mi ubicación</button>
        <p id="textoUbicacion"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
